<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>OPEX Minimap Layer</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: transparent; overflow: hidden;
      font-family: 'Segoe UI', Inter, sans-serif;
    }
    .frame { position: relative; width: 100%; height: 100%; box-sizing: border-box; }
    .frame.calibrating {
      border: 2px dashed rgba(56, 189, 248, 0.95);
      background: rgba(56, 189, 248, 0.14);
    }
    .mini-badge {
      position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
      padding: 2px 8px; border-radius: 999px;
      background: rgba(9, 11, 15, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #f1f5f9; font-size: 9px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
    }
    .mini-badge.ward-on {
      border-color: #facc15; color: #fef08a;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.55);
    }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame" id="miniFrame">
    <div class="mini-badge" id="miniBadge">OPEX HUD</div>
    <canvas id="miniCanvas" width="340" height="340"></canvas>
  </div>
  <script>
    let state = {
      clock_time: 0, effective_team: 'radiant', role: 'auto',
      has_observer: false, has_sentry: false, last_hits: 0,
      xpos: null, ypos: null, placed_wards: [],
      show_wards: true, show_farm: true, show_path: true, calibrate: false
    };

    let lastMinute = -1;
    let clearedCamps = new Set();
    let campStayMs = {}; // сколько миллисекунд герой стоит у каждого кемпа
    let prevLastHits = 0;
    let lastTickTs = Date.now();
    let detectedRole = 'pos1';
    let dash = 0;

    // Точная проекция мировых координат Dota 2 (-8200..+8200) в [0..1] миникарты
    function worldToMap(xpos, ypos) {
      if (typeof xpos !== 'number' || typeof ypos !== 'number') return null;
      return {
        x: Math.max(0.02, Math.min(0.98, (xpos + 8200) / 16400)),
        y: Math.max(0.02, Math.min(0.98, 1 - (ypos + 8200) / 16400))
      };
    }

    // Реальные нейтральные кемпы карты Dota 2 (только настоящие лагеря, без точек в миде!)
    const REAL_CAMPS = {
      radiant: {
        pos1: [
          { id: 'r_safe_small', x: 0.68, y: 0.79, name: 'Малый бот' },
          { id: 'r_safe_large', x: 0.78, y: 0.76, name: 'Большой бот' },
          { id: 'r_low_med',    x: 0.53, y: 0.77, name: 'Нижний лес' },
          { id: 'r_mid_large',  x: 0.46, y: 0.70, name: 'Центр лес' },
          { id: 'r_tri_large',  x: 0.28, y: 0.57, name: 'Большой треуг.' },
          { id: 'r_tri_anc',    x: 0.24, y: 0.51, name: 'Древние' }
        ],
        pos2: [
          { id: 'r_mid_med',    x: 0.41, y: 0.65, name: 'Средний у мида' },
          { id: 'r_mid_large',  x: 0.46, y: 0.70, name: 'Большой у мида' },
          { id: 'r_tri_large',  x: 0.28, y: 0.57, name: 'Большой треуг.' },
          { id: 'r_tri_anc',    x: 0.24, y: 0.51, name: 'Древние' }
        ],
        pos3: [
          { id: 'r_west_large', x: 0.09, y: 0.46, name: 'Западный лес' },
          { id: 'r_tri_anc',    x: 0.24, y: 0.51, name: 'Древние' },
          { id: 'd_safe_large', x: 0.21, y: 0.24, name: 'Враж. большой топ' },
          { id: 'd_safe_small', x: 0.32, y: 0.22, name: 'Враж. малый топ' }
        ],
        pos4: [
          { id: 'r_west_large', x: 0.09, y: 0.46, name: 'Стак оффлейн' },
          { id: 'r_tri_anc',    x: 0.24, y: 0.51, name: 'Стак древних' }
        ],
        pos5: [
          { id: 'r_safe_small', x: 0.68, y: 0.79, name: 'Пул малого' },
          { id: 'r_low_med',    x: 0.53, y: 0.77, name: 'Стак для керри' },
          { id: 'r_mid_large',  x: 0.46, y: 0.70, name: 'Стак центра' }
        ]
      },
      dire: {
        pos1: [
          { id: 'd_safe_small', x: 0.32, y: 0.22, name: 'Малый топ' },
          { id: 'd_safe_large', x: 0.21, y: 0.24, name: 'Большой топ' },
          { id: 'd_up_med',     x: 0.43, y: 0.23, name: 'Верхний лес' },
          { id: 'd_mid_large',  x: 0.51, y: 0.29, name: 'Центр лес' },
          { id: 'd_tri_large',  x: 0.71, y: 0.42, name: 'Большой треуг.' },
          { id: 'd_tri_anc',    x: 0.75, y: 0.47, name: 'Древние' }
        ],
        pos2: [
          { id: 'd_mid_med',    x: 0.57, y: 0.35, name: 'Средний у мида' },
          { id: 'd_mid_large',  x: 0.51, y: 0.29, name: 'Большой у мида' },
          { id: 'd_tri_large',  x: 0.71, y: 0.42, name: 'Большой треуг.' },
          { id: 'd_tri_anc',    x: 0.75, y: 0.47, name: 'Древние' }
        ],
        pos3: [
          { id: 'd_east_large', x: 0.90, y: 0.55, name: 'Восточный лес' },
          { id: 'd_tri_anc',    x: 0.75, y: 0.47, name: 'Древние' },
          { id: 'r_safe_large', x: 0.78, y: 0.76, name: 'Враж. большой бот' },
          { id: 'r_safe_small', x: 0.68, y: 0.79, name: 'Враж. малый бот' }
        ],
        pos4: [
          { id: 'd_east_large', x: 0.90, y: 0.55, name: 'Стак оффлейн' },
          { id: 'd_tri_anc',    x: 0.75, y: 0.47, name: 'Стак древних' }
        ],
        pos5: [
          { id: 'd_safe_small', x: 0.32, y: 0.22, name: 'Пул малого' },
          { id: 'd_up_med',     x: 0.43, y: 0.23, name: 'Стак для керри' },
          { id: 'd_mid_large',  x: 0.51, y: 0.29, name: 'Стак центра' }
        ]
      }
    };

    // Реальные клиффы и споты вардов
    const REAL_WARDS = {
      radiant: {
        early: [
          { x: 0.40, y: 0.57, t: 'obs', name: 'Мид хайграунд' },
          { x: 0.64, y: 0.68, t: 'obs', name: 'Вход бот' },
          { x: 0.78, y: 0.76, t: 'sen', name: 'Блок большого' }
        ],
        mid: [
          { x: 0.52, y: 0.34, t: 'obs', name: 'Клифф леса Dire' },
          { x: 0.68, y: 0.52, t: 'obs', name: 'Клифф треуг. Dire' },
          { x: 0.31, y: 0.48, t: 'sen', name: 'Девард треуг.' }
        ]
      },
      dire: {
        early: [
          { x: 0.59, y: 0.44, t: 'obs', name: 'Мид хайграунд' },
          { x: 0.35, y: 0.32, t: 'obs', name: 'Вход топ' },
          { x: 0.21, y: 0.24, t: 'sen', name: 'Блок большого' }
        ],
        mid: [
          { x: 0.47, y: 0.65, t: 'obs', name: 'Клифф леса Rad' },
          { x: 0.31, y: 0.48, t: 'obs', name: 'Клифф треуг. Rad' },
          { x: 0.68, y: 0.52, t: 'sen', name: 'Девард треуг.' }
        ]
      }
    };

    function updateAutoRole(heroPos, isDire) {
      if (!heroPos) return;
      const { x, y } = heroPos;
      if (Math.abs(x - (1 - y)) < 0.12 && x > 0.32 && x < 0.68) { detectedRole = 'pos2'; return; }
      if (x < 0.36 && y < 0.52) { detectedRole = isDire ? 'pos1' : 'pos3'; return; }
      if (x > 0.56 && y > 0.52) { detectedRole = isDire ? 'pos3' : 'pos1'; }
    }

    function drawArrow(ctx, x1, y1, x2, y2, color) {
      const ang = Math.atan2(y2 - y1, x2 - x1);
      const mx = (x1 + x2) * 0.5, my = (y1 + y2) * 0.5;
      ctx.save();
      ctx.translate(mx, my); ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(6, 0); ctx.lineTo(-4, -4); ctx.lineTo(-2, 0); ctx.lineTo(-4, 4);
      ctx.closePath(); ctx.fillStyle = color; ctx.fill();
      ctx.restore();
    }

    function draw() {
      const now = Date.now();
      const dt = Math.min(200, now - lastTickTs);
      lastTickTs = now;

      const c = document.getElementById('miniCanvas');
      const ctx = c.getContext('2d');
      const w = c.width, h = c.height;
      ctx.clearRect(0, 0, w, h);

      document.getElementById('miniFrame').classList.toggle('calibrating', Boolean(state.calibrate));

      const curMin = Math.floor(Math.max(0, state.clock_time || 0) / 60);
      if (curMin !== lastMinute) {
        clearedCamps.clear();
        campStayMs = {};
        lastMinute = curMin;
      }

      const side = String(state.effective_team || 'radiant').toLowerCase() === 'dire' ? 'dire' : 'radiant';
      const heroPos = worldToMap(state.xpos, state.ypos);

      let pos = state.role || 'auto';
      if (pos === 'auto') { updateAutoRole(heroPos, side === 'dire'); pos = detectedRole; }
      if (!REAL_CAMPS[side][pos]) pos = 'pos1';

      const camps = REAL_CAMPS[side][pos];
      const wards = (state.clock_time || 0) < 480 ? REAL_WARDS[side].early : REAL_WARDS[side].mid;
      const placed = (state.placed_wards || []).map(pw => ({ ...pw, pos: worldToMap(pw.xpos, pw.ypos) })).filter(pw => pw.pos);

      // Кемп зафармлен, если герой рядом добил крипа (last_hits вырос) ИЛИ фармил его >= 3 сек
      const lhIncreased = (state.last_hits || 0) > prevLastHits;
      prevLastHits = state.last_hits || 0;

      if (heroPos) {
        camps.forEach(cp => {
          if (clearedCamps.has(cp.id)) return;
          const dist = Math.hypot(heroPos.x - cp.x, heroPos.y - cp.y);
          if (dist < 0.055) {
            campStayMs[cp.id] = (campStayMs[cp.id] || 0) + dt;
            if (lhIncreased || campStayMs[cp.id] >= 3000) {
              clearedCamps.add(cp.id);
            }
          }
        });
      }

      // Сортируем оставшиеся кемпы по близости к герою
      const remaining = camps.filter(cp => !clearedCamps.has(cp.id));
      if (heroPos && remaining.length > 1) {
        remaining.sort((a, b) => Math.hypot(heroPos.x - a.x, heroPos.y - a.y) - Math.hypot(heroPos.x - b.x, heroPos.y - b.y));
      }
      const nextCamp = remaining[0] || null;
      const pulse = (Math.sin(now / 220) + 1) * 0.5;

      // Проверяем, есть ли ещё непокрытые споты вардов
      const uncoveredWards = wards.filter(wd => !placed.some(pw => Math.hypot(pw.pos.x - wd.x, pw.pos.y - wd.y) < 0.095));
      const needsWard = (state.has_observer || state.has_sentry) && uncoveredWards.length > 0;

      const badge = document.getElementById('miniBadge');
      if (state.calibrate) {
        badge.textContent = 'ПОДГОНКА РАМКИ';
        badge.classList.remove('ward-on');
      } else if (needsWard) {
        badge.textContent = 'ПОСТАВЬ ВАРД';
        badge.classList.add('ward-on');
      } else if (nextCamp) {
        badge.textContent = `ФАРМ: ${nextCamp.name}`;
        badge.classList.remove('ward-on');
      } else {
        badge.textContent = 'ВСЕ КЕМПЫ ЗАБРАНЫ (:00)';
        badge.classList.remove('ward-on');
      }

      // 1. Кемпы
      if (state.show_farm !== false) {
        camps.forEach(cp => {
          const x = cp.x * w, y = cp.y * h;
          const isCleared = clearedCamps.has(cp.id);
          const isNext = nextCamp && nextCamp.id === cp.id;
          if (isCleared) {
            ctx.beginPath(); ctx.arc(x, y, 5.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(148, 163, 184, 0.35)'; ctx.fill();
            ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(x - 2.5, y); ctx.lineTo(x - 0.5, y + 2); ctx.lineTo(x + 3, y - 2.5); ctx.stroke();
          } else {
            ctx.beginPath(); ctx.arc(x, y, isNext ? 10 + pulse * 5 : 7.5, 0, Math.PI * 2);
            ctx.fillStyle = isNext ? 'rgba(74, 222, 128, 0.32)' : 'rgba(74, 222, 128, 0.14)'; ctx.fill();
            ctx.strokeStyle = isNext ? '#4ade80' : 'rgba(74, 222, 128, 0.7)';
            ctx.lineWidth = isNext ? 2.2 : 1.3; ctx.stroke();
          }
        });
      }

      // 2. Маршрут фарма
      if (state.show_path !== false && remaining.length > 0) {
        const pts = heroPos ? [heroPos, ...remaining.slice(0, 3)] : remaining.slice(0, 3);
        if (pts.length > 1) {
          ctx.save();
          ctx.strokeStyle = 'rgba(241, 245, 249, 0.9)'; ctx.lineWidth = 2;
          ctx.setLineDash([6, 5]); ctx.lineDashOffset = -dash;
          ctx.beginPath();
          pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x * w, p.y * h) : ctx.lineTo(p.x * w, p.y * h));
          ctx.stroke(); ctx.restore();
          drawArrow(ctx, pts[0].x * w, pts[0].y * h, pts[1].x * w, pts[1].y * h, '#4ade80');
        }
      }

      // 3. Варды (если спот уже закрыт поставленным вардом — не просим ставить, показываем галочку)
      if (state.show_wards !== false) {
        wards.forEach(wd => {
          const isCovered = placed.some(pw => Math.hypot(pw.pos.x - wd.x, pw.pos.y - wd.y) < 0.095);
          if (isCovered) return;
          const x = wd.x * w, y = wd.y * h;
          const isObs = wd.t === 'obs';
          const active = isObs ? state.has_observer : state.has_sentry;
          const color = isObs ? '#facc15' : '#38bdf8';
          ctx.save();
          ctx.shadowColor = color; ctx.shadowBlur = active ? 15 : 6;
          ctx.beginPath(); ctx.arc(x, y, active ? 7 + pulse * 6 : 5, 0, Math.PI * 2);
          ctx.strokeStyle = color; ctx.lineWidth = active ? 2.4 : 1.4; ctx.stroke();
          ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill();
          ctx.restore();
        });

        // Поставленные игроком варды (горят зелёным кольцом)
        placed.forEach(pw => {
          const x = pw.pos.x * w, y = pw.pos.y * h;
          ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(34, 197, 94, 0.45)'; ctx.fill();
          ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 1.6; ctx.stroke();
        });
      }

      // 4. Живая позиция героя
      if (heroPos) {
        ctx.beginPath(); ctx.arc(heroPos.x * w, heroPos.y * h, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff'; ctx.fill();
        ctx.strokeStyle = '#090b0f'; ctx.lineWidth = 1.5; ctx.stroke();
      }

      dash = (dash + 0.55) % 22;
      requestAnimationFrame(draw);
    }

    async function poll() {
      try { state = await (await fetch('http://127.0.0.1:4000/state')).json(); } catch (_) {}
    }

    draw();
    setInterval(poll, 450);
  </script>
</body>
</html>
